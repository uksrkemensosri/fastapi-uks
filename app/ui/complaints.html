<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keluhan Masuk | SEHATI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui/assets/theme.css?v=126">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif}.layout{display:flex;min-height:100vh}.sidebar{width:210px;flex-shrink:0;padding:22px 16px}.logo-area{display:flex;align-items:center;gap:10px;padding-bottom:20px;border-bottom:1px solid rgba(148,163,184,.25)}.sidebar-logo{width:42px;height:42px;object-fit:contain}.logo-title{font-weight:800;font-size:14px}.logo-sub{font-size:10px;color:var(--muted)}.menu{display:grid;gap:8px;margin-top:24px}.menu-item{padding:12px 15px;border-radius:14px;text-decoration:none;font-size:14px;font-weight:700;color:var(--primary)}.menu-item.active{background:linear-gradient(135deg,#ec6cc4,#8b5cf6,#60a5fa);color:white;box-shadow:0 10px 24px rgba(139,92,246,.24)}.main{flex:1;min-width:0;padding:34px}.topbar,.card{background:var(--card);border:1px solid rgba(255,255,255,.65);box-shadow:var(--shadow)}.topbar{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:24px 28px;border-radius:24px;margin-bottom:24px}.topbar h1{margin:0 0 6px;color:var(--primary);font-size:2rem}.topbar p{margin:0;color:var(--muted)}.user-box{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:14px;padding:11px 15px;font:700 13px Inter,Arial,sans-serif;cursor:pointer}.btn-primary{color:white;background:linear-gradient(135deg,#5a6ff1,#7b58e7)}.btn-secondary{color:var(--primary);background:var(--card)}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:22px}.summary-card{padding:18px;border-radius:20px;background:var(--card);box-shadow:var(--shadow)}.summary-card span{display:block;color:var(--muted);font-size:13px;font-weight:600}.summary-card strong{display:block;color:var(--primary);font-size:29px;margin-top:8px}.card{border-radius:24px;padding:22px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid #dbe3ef;border-radius:999px;padding:9px 13px;background:transparent;color:var(--muted);font:700 12px Inter,Arial,sans-serif;cursor:pointer}.filter.active{border-color:#7588f2;color:#fff;background:#6272e7}.complaint-list{display:grid;gap:12px}.complaint{border:1px solid #e5eaf4;border-radius:18px;padding:17px;background:rgba(255,255,255,.62)}.complaint-header{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.student{font-weight:800;color:var(--primary)}.class-date{color:var(--muted);font-size:12px;margin-top:4px}.status{border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;white-space:nowrap}.MENUNGGU{background:#fff7d6;color:#a16207}.DITINDAKLANJUTI{background:#e8f0ff;color:#3157ba}.SELESAI{background:#dcfce7;color:#16723d}.DIBATALKAN{background:#f1f5f9;color:#64748b}.message{margin:14px 0;color:var(--text);line-height:1.55;white-space:pre-wrap}.meta{font-size:12px;color:var(--muted)}.reporter{margin-bottom:5px;color:var(--primary);font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.empty{padding:30px 10px;text-align:center;color:var(--muted)}body.dark .complaint{background:rgba(30,41,59,.55);border-color:#475569}body.dark .filter{border-color:#475569}@media(max-width:900px){.sidebar{display:none}.main{padding:18px}.summary{grid-template-columns:1fr}.topbar{padding:20px}.topbar h1{font-size:1.65rem}}@media(max-width:480px){.main{padding:14px}.topbar{align-items:flex-start;flex-direction:column}.complaint-header{flex-direction:column}.user-box{width:100%;justify-content:space-between}}
  </style>
</head>
<body>
  <div class="layout"><aside class="sidebar"><div class="logo-area"><img class="sidebar-logo" src="/ui/assets/logo-sekolah-rakyat.png" alt=""><div><div class="logo-title">EMR UKS</div><div class="logo-sub">Sekolah Rakyat</div></div></div><nav class="menu"><a href="/dashboard" class="menu-item">Dashboard</a><a href="/students" class="menu-item">Data Siswa</a><a href="/reports" class="menu-item">Laporan</a><a href="/ckg" class="menu-item">CKG</a><a href="/users" class="menu-item">Pengguna</a><a href="/audit-logs" class="menu-item">Audit Log</a><a href="/settings" class="menu-item">Pengaturan</a></nav></aside>
  <main class="main"><header class="topbar"><div><h1>Keluhan Masuk</h1><p>Antrean laporan awal siswa dari QR Code SEHATI</p></div><div class="user-box"><button id="btnTheme" data-global-theme="true" class="btn btn-secondary" type="button">&#127769;</button><button id="btnLogout" class="btn btn-secondary" type="button">Logout</button></div></header>
  <section class="summary"><div class="summary-card"><span>Menunggu</span><strong id="pendingCount">0</strong></div><div class="summary-card"><span>Ditindaklanjuti</span><strong id="followUpCount">0</strong></div><div class="summary-card"><span>Selesai</span><strong id="completedCount">0</strong></div></section>
  <section class="card"><div class="toolbar"><div><h2 style="margin:0;color:var(--primary)">Antrean Keluhan</h2><p style="margin:6px 0 0;color:var(--muted);font-size:13px">Pilih laporan untuk ditindaklanjuti atau dibuatkan kunjungan UKS.</p></div><div class="filters"><button class="filter active" data-status="">Semua</button><button class="filter" data-status="MENUNGGU">Menunggu</button><button class="filter" data-status="DITINDAKLANJUTI">Ditindaklanjuti</button><button class="filter" data-status="SELESAI">Selesai</button></div></div><div id="complaintList" class="complaint-list"><div class="empty">Memuat keluhan...</div></div></section></main></div>
  <script>
    const token=localStorage.getItem('access_token')||'';let activeStatus='';let role='';
    async function api(path,method='GET'){const res=await fetch(path,{method,headers:{Authorization:`Bearer ${token}`}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.detail||'Permintaan gagal');return data}
    function formatDate(value){return value?new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value)):'-'}
    function escapeHtml(value){const div=document.createElement('div');div.textContent=value||'';return div.innerHTML}
    async function loadComplaints(){try{const items=await api(`/api/complaints${activeStatus?`?status=${activeStatus}`:''}`);const totals={MENUNGGU:0,DITINDAKLANJUTI:0,SELESAI:0};items.forEach(item=>{if(Object.prototype.hasOwnProperty.call(totals,item.status))totals[item.status]++});pendingCount.textContent=totals.MENUNGGU;followUpCount.textContent=totals.DITINDAKLANJUTI;completedCount.textContent=totals.SELESAI;complaintList.innerHTML=items.length?items.map(item=>`<article class="complaint"><div class="complaint-header"><div><div class="student">${escapeHtml(item.patient_name)}</div><div class="class-date">${escapeHtml(item.class_name||'-')} · ${formatDate(item.submitted_at)}</div></div><span class="status ${item.status}">${item.status.replace('_',' ')}</span></div><p class="message">${escapeHtml(item.complaint)}</p><div class="meta reporter">${item.reporter_name?`Dilaporkan oleh ${escapeHtml(item.reporter_name)}`:'Pelapor belum tercatat'}</div><div class="meta">${item.handled_by_name?`Ditangani oleh ${escapeHtml(item.handled_by_name)}${item.handled_at?` · ${formatDate(item.handled_at)}`:''}`:'Belum ditangani'}</div><div class="actions">${item.status==='MENUNGGU'?`<button class="btn btn-primary" onclick="followUp(${item.id})">Tindaklanjuti</button>`:''}${!item.visit_id&&item.status!=='SELESAI'&&item.status!=='DIBATALKAN'?`<button class="btn btn-secondary" onclick="createVisit(${item.id})">Buat Kunjungan UKS</button>`:''}${item.status==='DITINDAKLANJUTI'?`<button class="btn btn-secondary" onclick="completeComplaint(${item.id})">Tandai Selesai</button>`:''}${item.visit_id?`<span class="meta" style="align-self:center">Kunjungan UKS #${item.visit_id}</span>`:''}</div></article>`).join(''):'<div class="empty">Belum ada keluhan pada filter ini.</div>';}catch(err){complaintList.innerHTML=`<div class="empty">${escapeHtml(err.message)}</div>`}}
    async function followUp(id){try{await api(`/api/complaints/${id}/follow-up`,'POST');loadComplaints()}catch(err){appAlert('Gagal',err.message,'error')}}
    async function completeComplaint(id){try{await api(`/api/complaints/${id}/complete`,'POST');loadComplaints()}catch(err){appAlert('Gagal',err.message,'error')}}
    async function createVisit(id){try{const prefill=await api(`/api/complaints/${id}/visit-prefill`);sessionStorage.setItem('sehati_complaint_visit_prefill',JSON.stringify(prefill));location.href='/students'}catch(err){appAlert('Gagal',err.message,'error')}}
    document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(item=>item.classList.remove('active'));button.classList.add('active');activeStatus=button.dataset.status;loadComplaints()}));
    (async()=>{if(!token){location.href='/login';return}try{role=(await api('/api/auth/me')).role;if(!['admin','perawat','tim_uksr','super_admin'].includes(role)){location.href='/dashboard';return}loadComplaints()}catch(_){location.href='/login'}})();
  </script><script src="/ui/assets/dialogs.js?v=1"></script><script src="/ui/assets/rbac.js?v=12" defer></script>
</body>
</html>
