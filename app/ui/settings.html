<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengaturan UKS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui/assets/theme.css?v=10">
  <style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

.main{
  flex:1;
  padding:34px;
}

.topbar{

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:28px;

}

.user-box{

  display:flex;
  align-items:center;
  gap:12px;

}

@media(max-width:900px){

  .sidebar{
    display:none;
  }

  .main{
    padding:18px;
  }

  .topbar{
    flex-direction:column;
    align-items:flex-start;
    gap:12px;
  }

}

</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo-area"><img
  src="/ui/assets/logo-sekolah-rakyat.png"
  class="sidebar-logo"alt="">
   <div><div style="font-weight:700">EMR UKS</div><div style="font-size:.82rem;opacity:.8">Sekolah Rakyat</div></div>
    </div>
    <div class="menu">
      <a href="/dashboard" class="menu-item">Dashboard</a>
      <a href="/students" class="menu-item">Data Siswa</a>
      <a href="/reports" class="menu-item">Laporan</a>
      <a href="/settings" class="menu-item active">Pengaturan</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">

      <div>
        <h1>Pengaturan UKS</h1>
        <p>Kelola informasi dasar aplikasi UKS</p>
      </div>

      <div class="user-box" style="display:flex;align-items:center;gap:10px;">
        <button class="btn btn-secondary" id="btnTheme" style="margin:0;width:auto;padding:10px 12px;">🌙</button>
        <button class="btn btn-secondary" id="btnLogout" style="margin:0;">Logout</button>
      </div>

    </div>
    <section class="card settings-card">

  <div class="form-group settings-form">
    <label>Nama Sekolah</label>
    <input type="text">
  </div>

  <div class="form-group">
    <label>Nama Petugas UKS</label>
    <input type="text">
  </div>

  <div class="form-group">
    <label>Nomor Telepon</label>
    <input type="text">
  </div>

  <button class="btn btn-primary">
    Simpan Pengaturan
  </button>

</section>
  </main>
</div>

<script>
const token = localStorage.getItem('access_token') || '';
if(!token){ window.location.href = '/login'; }

document.getElementById('btnLogout').addEventListener('click',()=>{
  localStorage.removeItem('access_token');
  window.location.href='/login';
});

const themeBtn = document.getElementById('btnTheme');
const savedTheme = localStorage.getItem('theme');
if(savedTheme === 'dark'){
  document.body.classList.add('dark');
  themeBtn.innerHTML='🌙';
}

themeBtn.addEventListener('click',()=>{
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  themeBtn.innerHTML =
  isDark
  ? '🌙'
  : '☀️';
});
</script>
</body>
</html>
