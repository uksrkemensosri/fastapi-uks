<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengaturan UKS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui/assets/theme.css?v=10">
  <style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

.main{
  flex:1;
  padding:34px;
}

.topbar{

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:28px;

}

.user-box{

  display:flex;
  align-items:center;
  gap:12px;

}

.admin-only{
  display:none;
}

body[data-role="admin"] .admin-only{
  display:block;
}

@media(max-width:900px){

  .sidebar{
    display:none;
  }

  .main{
    padding:18px;
  }

  .topbar{
    flex-direction:column;
    align-items:flex-start;
    gap:12px;
  }

}

</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo-area"><img
  src="/ui/assets/logo-sekolah-rakyat.png"
  class="sidebar-logo"alt="">
   <div><div class="logo-title">EMR UKS</div><div class="logo-sub">Sekolah Rakyat</div></div>
    </div>
    <div class="menu">
      <a href="/dashboard" class="menu-item">Dashboard</a>
      <a href="/students" class="menu-item">Data Siswa</a>
      <a href="/reports" class="menu-item">Laporan</a>
      <a href="/ckg" class="menu-item">CKG</a>
      <a href="/users" class="menu-item">Pengguna</a>
      <a href="/audit-logs" class="menu-item">Audit Log</a>
      <a href="/settings" class="menu-item active">Pengaturan</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">

      <div>
        <h1>Pengaturan UKS</h1>
        <p>Kelola informasi dasar aplikasi UKS</p>
      </div>

      <div class="user-box" style="display:flex;align-items:center;gap:10px;">
        <button class="btn btn-secondary" id="btnTheme" style="margin:0;width:auto;padding:10px 12px;">🌙</button>
        <button class="btn btn-secondary" id="btnLogout" style="margin:0;">Logout</button>
      </div>

    </div>
    <section class="card">

  <h2>Profil Saya</h2>

  <div class="form-group">
    <label>Nama Lengkap</label>
    <input id="fullName" type="text">
  </div>

  <div class="form-group">
    <label>Username</label>
    <input id="username" type="text" readonly>
  </div>

  <div class="form-group">
    <label>Role</label>
    <input id="role" type="text" readonly>
  </div>

  <div class="form-group">
    <label>NIP</label>
    <input id="nip" type="text">
  </div>

  <div class="form-group">
    <label>Jabatan</label>
    <input id="jabatan" type="text" placeholder="Perawat Pemeriksa">
  </div>

  <div class="form-group">
    <label>Upload Tanda Tangan (PNG/JPG)</label>
    <input id="signatureFile" type="file" accept="image/png,image/jpeg">
  </div>

  <div class="form-group">
    <img id="signaturePreview" alt="" style="max-width:220px;display:none;border-radius:12px;background:white;padding:8px;">
  </div>

  <button class="btn btn-primary" id="btnSaveProfile" type="button">
    Simpan Profil
  </button>

</section>

<br>

<section class="card admin-only">

  <h2>Tools Admin</h2>
  <p style="color:#64748b;margin-top:-10px;margin-bottom:18px;">
    Backup, restore, import siswa, dan cek kesehatan sistem.
  </p>

  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;">
    <button class="btn btn-primary" id="btnHealthCheck" type="button">Health Check Sistem</button>
    <button class="btn btn-secondary" id="btnBackup" type="button">Backup Data</button>
    <button class="btn btn-secondary" id="btnRestore" type="button">Restore Data</button>
  </div>

  <div class="form-group">
    <label>Import Siswa dari Excel</label>
    <input id="studentExcelFile" type="file" accept=".xlsx,.xls">
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;">
    <button class="btn btn-secondary" id="btnPreviewImport" type="button">Preview Import</button>
    <button class="btn btn-primary" id="btnImportStudents" type="button">Import Siswa</button>
  </div>
  <div id="adminToolResult" class="status"></div>

</section>

<br>

<section class="card">

  <h2>Ubah Password</h2>

  <div class="form-group">
    <label>Password Lama</label>
    <input id="currentPassword" type="password">
  </div>

  <div class="form-group">
    <label>Password Baru</label>
    <input id="newPassword" type="password">
  </div>

  <button
    class="btn btn-primary"
    id="btnChangePassword">

    Ubah Password

  </button>

</section>
  </main>
</div>

<script src="/ui/assets/dialogs.js?v=1"></script>
<script>
const token = localStorage.getItem('access_token') || '';
if(!token){ window.location.href = '/login'; }
let signatureImage = null;

document.getElementById('btnLogout').addEventListener('click',()=>{
  localStorage.removeItem('access_token');
  window.location.href='/login';
});

const themeBtn = document.getElementById('btnTheme');
const savedTheme = localStorage.getItem('theme');
if(savedTheme === 'dark'){
  document.body.classList.add('dark');
  themeBtn.innerHTML='🌙';
}

themeBtn.addEventListener('click',()=>{
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  themeBtn.innerHTML =
  isDark
  ? '🌙'
  : '☀️';
});
function syncThemeButton(){
  themeBtn.textContent =
    document.body.classList.contains('dark')
      ? '☀️'
      : '🌙';
}

if(localStorage.getItem('theme') === 'true'){
  document.body.classList.add('dark');
  localStorage.setItem('theme', 'dark');
}

syncThemeButton();
themeBtn.addEventListener('click', syncThemeButton);

async function loadProfile(){

  const res = await fetch(
    '/api/auth/me',
    {
      headers:{
        Authorization:
          `Bearer ${token}`
      }
    }
  );

  if(!res.ok){
    return;
  }

  const user = await res.json();

  document.getElementById('fullName').value =
    user.full_name || '';

  document.getElementById('username').value =
    user.username || '';

  document.getElementById('role').value =
    user.role || '';

  document.getElementById('nip').value =
    user.nip || '';

  document.getElementById('jabatan').value =
    user.jabatan || '';

  signatureImage = user.signature_image || null;
  if(signatureImage){
    signaturePreview.src = signatureImage;
    signaturePreview.style.display = 'block';
  }

}

loadProfile();

function readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

btnHealthCheck.addEventListener('click', async () => {
  const res = await fetch('/api/system/health-check', {
    headers:{Authorization:`Bearer ${token}`}
  });
  const data = await res.json();
  const text = data.checks.map(item => `${item.status.toUpperCase()} - ${item.name}: ${item.detail}`).join('\n');
  adminToolResult.textContent = text;
  appAlert('Health Check Sistem', text || 'Tidak ada hasil.', data.status === 'ok' ? 'success' : 'error');
});

btnBackup.addEventListener('click', async () => {
  const res = await fetch('/api/admin/backup', {
    headers:{Authorization:`Bearer ${token}`}
  });
  if(!res.ok){
    appAlert('Gagal', 'Backup gagal dibuat.', 'error');
    return;
  }
  downloadBlob(await res.blob(), `backup_emr_uks_${new Date().toISOString().slice(0,10)}.json`);
  appAlert('Berhasil', 'Backup data berhasil diunduh.', 'success');
});

btnRestore.addEventListener('click', async () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async () => {
    const file = input.files[0];
    if(!file){ return; }
    const text = await file.text();
    const payload = JSON.parse(text);
    const ok = await appConfirm('Restore Data?', 'Data dari file backup akan ditambahkan atau memperbarui data yang sudah ada.', {confirmText:'Ya, Restore', type:'warning'});
    if(!ok){ return; }
    const res = await fetch('/api/admin/restore', {
      method:'POST',
      headers:{'Content-Type':'application/json', Authorization:`Bearer ${token}`},
      body:JSON.stringify(payload)
    });
    const data = await res.json();
    if(!res.ok){
      appAlert('Gagal', data.detail || 'Restore gagal.', 'error');
      return;
    }
    appAlert('Berhasil', data.message || 'Restore selesai.', 'success');
  };
  input.click();
});

async function importStudents(preview){
  const file = studentExcelFile.files[0];
  if(!file){
    appAlert('File Belum Dipilih', 'Pilih file Excel siswa terlebih dahulu.', 'error');
    return;
  }
  const content = await readFileAsDataUrl(file);
  const res = await fetch('/api/patients/import-excel', {
    method:'POST',
    headers:{'Content-Type':'application/json', Authorization:`Bearer ${token}`},
    body:JSON.stringify({filename:file.name, content_base64:content, preview})
  });
  const data = await res.json();
  if(!res.ok){
    appAlert('Gagal', data.detail || 'Import gagal.', 'error');
    return;
  }
  if(preview){
    const text = `Total terbaca: ${data.total}\n\n` + data.preview.map(row => `${row.id} - ${row.name} - ${row.class_name || '-'}`).join('\n');
    adminToolResult.textContent = text;
    appAlert('Preview Import', text || 'Tidak ada data.', 'info');
  }else{
    appAlert('Berhasil', `Import selesai. Baru: ${data.created}, update: ${data.updated}.`, 'success');
  }
}

btnPreviewImport.addEventListener('click', () => importStudents(true));
btnImportStudents.addEventListener('click', () => importStudents(false));

signatureFile.addEventListener('change', () => {
  const file = signatureFile.files[0];
  if(!file){ return; }
  if(!['image/png','image/jpeg'].includes(file.type)){
    appAlert('Format Tidak Sesuai', 'Tanda tangan harus PNG atau JPG.', 'error');
    signatureFile.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    signatureImage = reader.result;
    signaturePreview.src = signatureImage;
    signaturePreview.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

btnSaveProfile.addEventListener('click', async () => {
  const res = await fetch('/api/auth/profile', {
    method:'PATCH',
    headers:{
      'Content-Type':'application/json',
      Authorization:`Bearer ${token}`
    },
    body:JSON.stringify({
      full_name:fullName.value.trim(),
      nip:nip.value.trim(),
      jabatan:jabatan.value.trim(),
      signature_image:signatureImage
    })
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok){
    appAlert('Gagal', data.detail || 'Gagal menyimpan profil', 'error');
    return;
  }
  appAlert('Berhasil', 'Profil tersimpan.', 'success');
});

document
.getElementById('btnChangePassword')
.addEventListener('click', async()=>{

  const currentPassword =
    document.getElementById(
      'currentPassword'
    ).value;

  const newPassword =
    document.getElementById(
      'newPassword'
    ).value;

  const res = await fetch(

    '/api/auth/change-password',

    {
      method:'POST',

      headers:{
        'Content-Type':
          'application/json',

        Authorization:
          `Bearer ${token}`
      },

      body:JSON.stringify({

        current_password:
          currentPassword,

        new_password:
          newPassword

      })

    }

  );

  const data = await res.json();

  if(res.ok){

    appAlert(
      'Berhasil',
      'Password berhasil diubah.',
      'success'
    );

    document.getElementById(
      'currentPassword'
    ).value='';

    document.getElementById(
      'newPassword'
    ).value='';

  }else{

    appAlert(
      'Gagal',
      data.detail ||
      'Gagal mengubah password',
      'error'
    );

  }

});
</script>
<script src="/ui/assets/rbac.js?v=2" defer></script>
</body>
</html>
