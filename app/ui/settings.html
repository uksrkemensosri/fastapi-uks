<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pengaturan UKS</title>

  <style>

    body{

      font-family:Arial,sans-serif;

      background:#f1f5f9;

      margin:0;
      padding:40px;

    }

    .card{

      background:white;

      border-radius:24px;

      padding:32px;

      max-width:700px;

      margin:auto;

      box-shadow:
        0 10px 30px rgba(15,23,42,.08);

    }

    h1{

      margin-top:0;

      color:#0f172a;

    }

    .form-group{

      margin-bottom:20px;

    }

    label{

      display:block;

      margin-bottom:8px;

      font-weight:600;

      color:#334155;

    }

    input{

      width:100%;

      padding:14px;

      border-radius:14px;

      border:1px solid #cbd5e1;

      font-size:1rem;

    }

    button{

      background:#14b8a6;

      color:white;

      border:none;

      padding:14px 22px;

      border-radius:14px;

      font-size:1rem;

      font-weight:700;

      cursor:pointer;

    }

  </style>

</head>

<body>

  <div class="card">

    <h1>
      ⚙️ Pengaturan UKS
    </h1>

    <div class="form-group">

      <label>
        Nama Sekolah
      </label>

      <input
        type="text"
        placeholder="Contoh: SDN Karangkitri"
      >

    </div>

    <div class="form-group">

      <label>
        Nama Petugas UKS
      </label>

      <input
        type="text"
        placeholder="Contoh: Nur Indah Fitriana"
      >

    </div>

    <div class="form-group">

      <label>
        Nomor Telepon
      </label>

      <input
        type="text"
        placeholder="08xxxxxxxxxx"
      >

    </div>

    <button>
      Simpan Pengaturan
    </button>

  </div>
<script>

console.log("SETTINGS PAGE ACTIVE");

</script>
<script>

localStorage.setItem(
  "currentPage",
  "settings"
);

</script>
</body>

</html>
