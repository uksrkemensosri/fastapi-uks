<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengaturan UKS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--primary:#ec4899;--primary-dark:#a21caf;--primary-light:#60a5fa;--bg:#f4f7fb;--card:#ffffff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--shadow:0 10px 30px rgba(236,72,153,.14)}
    body{font-family:'Inter',sans-serif;background:#f5f7fb;color:var(--text);min-height:100vh;transition:.3s}
    .layout{display:flex;min-height:100vh}
    .sidebar{width:260px;background:linear-gradient(180deg,var(--primary),var(--primary-dark));color:#fff;padding:28px 22px;position:fixed;inset:0 auto 0 0}
    .logo-area{display:flex;align-items:center;gap:14px;margin-bottom:40px}
    .logo{width:54px;height:54px;border-radius:14px;background:#fff;padding:6px}
    .menu{display:flex;flex-direction:column;gap:10px}
    .menu-item{padding:14px 16px;border-radius:14px;transition:.2s;font-weight:600;text-decoration:none;color:#fff;display:block}
    .menu-item:hover,.menu-item.active{background:rgba(255,255,255,.12)}
    .main{margin-left:260px;flex:1;padding:30px}
    .topbar{background:rgba(255,255,255,.7);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.5);border-radius:24px;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;box-shadow:var(--shadow)}
    .topbar p{color:var(--muted)}
    .user-box{display:flex;gap:10px;background:#fff;padding:10px 16px;border-radius:16px;box-shadow:var(--shadow)}
    .btn{border:none;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
    .btn-secondary{background:#ecfeff;color:var(--primary)}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.04);max-width:760px}
    .form-group{margin-bottom:16px}
    label{display:block;margin-bottom:8px;font-weight:600;color:#334155}
    input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:14px}
    .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;width:100%;padding:14px;border:none;border-radius:14px;font-weight:700;cursor:pointer}

    body.dark{background:linear-gradient(180deg,#cbd5e1,#94a3b8);color:#0f172a}
    body.dark .card,body.dark .topbar,body.dark .user-box{background:rgba(255,255,255,.72);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.65)}
    body.dark .sidebar{background:linear-gradient(180deg,#334155,#0f172a)}

    @media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:18px}.topbar{flex-direction:column;align-items:flex-start;gap:12px}}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo-area">
      <img class="logo" src="/ui/assets/sekolah-rakyat.png" alt="logo">
      <div><div style="font-weight:700">EMR UKS</div><div style="font-size:.82rem;opacity:.8">Sekolah Rakyat</div></div>
    </div>
    <div class="menu">
      <a href="/dashboard" class="menu-item">Dashboard</a>
      <a href="/students" class="menu-item">Data Siswa</a>
      <a href="/reports" class="menu-item">Laporan</a>
      <a href="/settings" class="menu-item active">Pengaturan</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Pengaturan UKS</h1>
        <p>Kelola informasi dasar aplikasi UKS</p>
      </div>
      <div class="user-box">
        <button class="btn btn-secondary" id="btnTheme">??</button>
        <button class="btn btn-secondary" id="btnLogout">Logout</button>
      </div>
    </div>

    <section class="card">
      <div class="form-group">
        <label>Nama Sekolah</label>
        <input type="text" placeholder="Contoh: Sekolah Rakyat 13 Bekasi">
      </div>
      <div class="form-group">
        <label>Nama Petugas UKS</label>
        <input type="text" placeholder="Contoh: Nur Indah Fitriana Dewi">
      </div>
      <div class="form-group">
        <label>Nomor Telepon</label>
        <input type="text" placeholder="08xxxxxxxxxx">
      </div>
      <button class="btn-primary">Simpan Pengaturan</button>
    </section>
  </main>
</div>

<script>
const token = localStorage.getItem('access_token') || '';
if(!token){ window.location.href = '/login'; }

document.getElementById('btnLogout').addEventListener('click',()=>{
  localStorage.removeItem('access_token');
  window.location.href='/login';
});

const themeBtn = document.getElementById('btnTheme');
const savedTheme = localStorage.getItem('theme');
if(savedTheme === 'dark'){
  document.body.classList.add('dark');
  themeBtn.textContent='??';
}

themeBtn.addEventListener('click',()=>{
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  themeBtn.textContent = isDark ? '??' : '??';
});
</script>
</body>
</html>
